<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchTogether - Real-Time Video Party</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Navbar -->
    <header class="p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-clapperboard text-indigo-500 text-xl"></i>
            <span class="text-xl font-bold tracking-tight text-white">Watch<span class="text-indigo-500">Together</span></span>
        </div>
        <div id="statusBadge" class="text-xs font-medium px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-slate-500"></span> Ready
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 w-full">
        
        <!-- Setup Screen -->
        <div id="setupScreen" class="w-full max-w-md bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-2xl space-y-6">
            
            <!-- Navigation Tabs -->
            <div class="flex border-b border-slate-800">
                <button id="tabCreateBtn" onclick="switchTab('create')" class="flex-1 pb-3 font-semibold text-indigo-400 border-b-2 border-indigo-500 transition">
                    Create Room
                </button>
                <button id="tabJoinBtn" onclick="switchTab('join')" class="flex-1 pb-3 font-semibold text-slate-400 border-b-2 border-transparent transition">
                    Join Room
                </button>
            </div>

            <!-- Create Room Section -->
            <div id="createSection" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Video URL (YouTube or Direct MP4):</label>
                    <input type="text" id="videoLinkInput" placeholder="https://www.youtube.com/watch?v=..." 
                           class="w-full p-3 rounded-lg bg-slate-800/80 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
                </div>
                <button id="createRoomBtn" onclick="handleCreateRoom()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-lg transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> Create Room
                </button>
            </div>

            <!-- Join Room Section -->
            <div id="joinSection" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Room Key:</label>
                    <input type="text" id="roomCodeInput" placeholder="Paste Room Key here..." 
                           class="w-full p-3 rounded-lg bg-slate-800/80 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
                </div>
                <button id="joinRoomBtn" onclick="handleManualJoin()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 font-bold rounded-lg transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Join Room
                </button>
            </div>

            <!-- Toast / Copy Alert -->
            <div id="alertMsg" class="hidden p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs text-center font-medium"></div>

        </div>

        <!-- Watch Theater Screen -->
        <div id="theaterScreen" class="w-full max-w-4xl flex-col items-center hidden space-y-4">
            
            <!-- Room Info & Copy Controls -->
            <div class="w-full bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-3 shadow-lg">
                <div class="flex items-center gap-3">
                    <span id="roleBadge" class="text-xs font-bold px-2.5 py-1 rounded-md bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">Host</span>
                    <div>
                        <div class="text-[10px] uppercase tracking-wider text-slate-400">Room Key</div>
                        <div id="displayKey" class="text-sm font-mono font-bold text-slate-200 select-all">Generating...</div>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="copyRoomKey()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
                        <i class="fa-regular fa-copy"></i> Copy Key
                    </button>
                    <button onclick="copyFullLink()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-xs font-semibold rounded-lg flex items-center gap-1.5 transition shadow-sm">
                        <i class="fa-solid fa-link"></i> Copy Invite Link
                    </button>
                </div>
            </div>

            <!-- Video Player -->
            <div class="w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl relative border border-slate-800 flex items-center justify-center">
                <!-- YouTube Container -->
                <div id="ytPlayer" class="w-full h-full"></div>
                <!-- Native Video Tag -->
                <video id="nativePlayer" class="w-full h-full hidden" controls playsinline></video>
            </div>

            <p class="text-xs text-slate-500 text-center">
                Playback controls (Play, Pause, Seek) are synchronized in real time.
            </p>
        </div>

    </main>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let peer = null;
        let conn = null;
        let isHost = false;
        let currentRoomId = null;
        let currentVideoSource = null;
        let currentVideoType = 'youtube'; // 'youtube' or 'native'
        let ytPlayer = null;
        let isInternalSync = false;

        // UI Tabs
        function switchTab(type) {
            const createSec = document.getElementById('createSection');
            const joinSec = document.getElementById('joinSection');
            const createBtn = document.getElementById('tabCreateBtn');
            const joinBtn = document.getElementById('tabJoinBtn');

            if(type === 'create') {
                createSec.classList.remove('hidden');
                joinSec.classList.add('hidden');
                createBtn.className = "flex-1 pb-3 font-semibold text-indigo-400 border-b-2 border-indigo-500 transition";
                joinBtn.className = "flex-1 pb-3 font-semibold text-slate-400 border-b-2 border-transparent transition";
            } else {
                joinSec.classList.remove('hidden');
                createSec.classList.add('hidden');
                joinBtn.className = "flex-1 pb-3 font-semibold text-emerald-400 border-b-2 border-emerald-500 transition";
                createBtn.className = "flex-1 pb-3 font-semibold text-slate-400 border-b-2 border-transparent transition";
            }
        }

        // Bulletproof Copy Mechanism (Works everywhere: HTTPS, HTTP, and Mobile)
        function safeCopy(text, successMessage) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showAlert(successMessage));
            } else {
                const tempInput = document.createElement("input");
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand('copy');
                    showAlert(successMessage);
                } catch (err) {
                    alert("Copy manually: " + text);
                }
                document.body.removeChild(tempInput);
            }
        }

        function showAlert(msg) {
            const alertBox = document.getElementById('alertMsg');
            alertBox.innerText = msg;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 3500);
        }

        function updateStatus(text, status) {
            const badge = document.getElementById('statusBadge');
            const color = status === 'connected' ? 'bg-emerald-500' : (status === 'connecting' ? 'bg-amber-500' : 'bg-slate-500');
            badge.innerHTML = `<span class="w-2 h-2 rounded-full ${color} ${status === 'connected' ? 'animate-pulse' : ''}"></span> ${text}`;
        }

        function getYouTubeId(url) {
            if(!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Initialize Peer
        function createPeerConnection(desiredId = null) {
            return new Promise((resolve, reject) => {
                updateStatus("Connecting to server...", "connecting");
                const p = desiredId ? new Peer(desiredId) : new Peer();
                
                p.on('open', (id) => {
                    peer = p;
                    currentRoomId = id;
                    document.getElementById('displayKey').innerText = id;
                    updateStatus("Ready / Waiting", "ready");
                    resolve(id);
                });

                p.on('error', (err) => {
                    console.error("Peer error:", err);
                    updateStatus("Connection Error", "error");
                    alert("Connection error: " + err.type);
                    reject(err);
                });
            });
        }

        // Host Creates Room
        async function handleCreateRoom() {
            const link = document.getElementById('videoLinkInput').value.trim();
            if(!link) return alert("Please enter a valid video link!");

            document.getElementById('createRoomBtn').disabled = true;
            document.getElementById('createRoomBtn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';

            isHost = true;
            currentVideoSource = link;
            const roomId = await createPeerConnection();

            // Listen for guests joining
            peer.on('connection', (c) => {
                conn = c;
                attachConnectionEvents();
                updateStatus("Guest Connected", "connected");

                // Immediately send video info to guest when they connect
                conn.on('open', () => {
                    conn.send({
                        type: 'INIT',
                        videoUrl: currentVideoSource,
                        currentTime: getCurrentTime()
                    });
                });
            });

            // Auto copy full invite link
            const fullUrl = buildInviteLink(roomId);
            safeCopy(fullUrl, "Room created! Invite link copied to clipboard.");

            // Launch Player
            initPlayer(link);
            showTheaterView(true);
        }

        // Guest Joins Room Manually
        async function handleManualJoin() {
            let key = document.getElementById('roomCodeInput').value.trim();
            if(!key) return alert("Please enter the Room Key!");

            // If user pasted full URL instead of key, extract the key
            if (key.includes('room=')) {
                const urlParams = new URLSearchParams(key.split('?')[1]);
                key = urlParams.get('room') || key;
            }

            document.getElementById('joinRoomBtn').disabled = true;
            document.getElementById('joinRoomBtn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Joining...';

            await joinTargetRoom(key);
        }

        // Connect to Target Room
        async function joinTargetRoom(targetKey) {
            isHost = false;
            await createPeerConnection();
            currentRoomId = targetKey;
            document.getElementById('displayKey').innerText = targetKey;

            updateStatus("Connecting to Host...", "connecting");
            conn = peer.connect(targetKey, { reliable: true });

            conn.on('open', () => {
                updateStatus("Connected to Host", "connected");
            });

            attachConnectionEvents();
            showTheaterView(false);
        }

        // Listen for Real-Time Sync Commands
        function attachConnectionEvents() {
            conn.on('data', (data) => {
                isInternalSync = true;
                if(data.type === 'INIT') {
                    currentVideoSource = data.videoUrl;
                    initPlayer(data.videoUrl, () => {
                        seekPlayer(data.currentTime || 0);
                    });
                } else if(data.type === 'PLAY') {
                    seekPlayer(data.time);
                    playPlayer();
                } else if(data.type === 'PAUSE') {
                    seekPlayer(data.time);
                    pausePlayer();
                } else if(data.type === 'SEEK') {
                    seekPlayer(data.time);
                }
                setTimeout(() => { isInternalSync = false; }, 800);
            });

            conn.on('close', () => {
                updateStatus("Partner Disconnected", "error");
            });
        }

        function broadcast(action, time = 0) {
            if(conn && conn.open && !isInternalSync) {
                conn.send({ type: action, time: time });
            }
        }

        // Video Player Handling
        function initPlayer(url, onReadyCallback) {
            const ytId = getYouTubeId(url);
            const nativeVideo = document.getElementById('nativePlayer');
            const ytDiv = document.getElementById('ytPlayer');

            if(ytId) {
                currentVideoType = 'youtube';
                nativeVideo.classList.add('hidden');
                ytDiv.classList.remove('hidden');

                const createYt = () => {
                    if (ytPlayer) {
                        ytPlayer.loadVideoById(ytId);
                        if(onReadyCallback) onReadyCallback();
                    } else {
                        ytPlayer = new YT.Player('ytPlayer', {
                            videoId: ytId,
                            playerVars: { 'autoplay': 0, 'controls': 1, 'playsinline': 1 },
                            events: {
                                'onReady': () => { if(onReadyCallback) onReadyCallback(); },
                                'onStateChange': onYouTubeStateChange
                            }
                        });
                    }
                };

                if (window.YT && window.YT.Player) {
                    createYt();
                } else {
                    window.onYouTubeIframeAPIReady = createYt;
                }
            } else {
                currentVideoType = 'native';
                ytDiv.classList.add('hidden');
                nativeVideo.classList.remove('hidden');
                nativeVideo.src = url;

                nativeVideo.onplay = () => {
                    if(!isInternalSync) broadcast('PLAY', nativeVideo.currentTime);
                };
                nativeVideo.onpause = () => {
                    if(!isInternalSync) broadcast('PAUSE', nativeVideo.currentTime);
                };
                nativeVideo.onseeked = () => {
                    if(!isInternalSync) broadcast('SEEK', nativeVideo.currentTime);
                };

                if(onReadyCallback) onReadyCallback();
            }
        }

        function onYouTubeStateChange(event) {
            if (isInternalSync) return;
            const time = ytPlayer.getCurrentTime();
            if (event.data === YT.PlayerState.PLAYING) {
                broadcast('PLAY', time);
            } else if (event.data === YT.PlayerState.PAUSED) {
                broadcast('PAUSE', time);
            }
        }

        function playPlayer() {
            if(currentVideoType === 'youtube' && ytPlayer && ytPlayer.playVideo) {
                ytPlayer.playVideo();
            } else {
                document.getElementById('nativePlayer').play();
            }
        }

        function pausePlayer() {
            if(currentVideoType === 'youtube' && ytPlayer && ytPlayer.pauseVideo) {
                ytPlayer.pauseVideo();
            } else {
                document.getElementById('nativePlayer').pause();
            }
        }

        function seekPlayer(seconds) {
            if(currentVideoType === 'youtube' && ytPlayer && ytPlayer.seekTo) {
                ytPlayer.seekTo(seconds, true);
            } else {
                document.getElementById('nativePlayer').currentTime = seconds;
            }
        }

        function getCurrentTime() {
            if(currentVideoType === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) {
                return ytPlayer.getCurrentTime();
            }
            return document.getElementById('nativePlayer').currentTime || 0;
        }

        function showTheaterView(isHostUser) {
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('theaterScreen').classList.remove('hidden');
            const badge = document.getElementById('roleBadge');
            badge.innerText = isHostUser ? "Host" : "Guest";
            badge.className = isHostUser 
                ? "text-xs font-bold px-2.5 py-1 rounded-md bg-indigo-500/20 text-indigo-400 border border-indigo-500/30"
                : "text-xs font-bold px-2.5 py-1 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        }

        function buildInviteLink(key) {
            return `${window.location.protocol}//${window.location.host}${window.location.pathname}?room=${key}`;
        }

        function copyRoomKey() {
            if(currentRoomId) {
                safeCopy(currentRoomId, "Room Key copied!");
            }
        }

        function copyFullLink() {
            if(currentRoomId) {
                safeCopy(buildInviteLink(currentRoomId), "Invite Link copied!");
            }
        }

        // Auto-Join if URL has query parameter ?room=KEY
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const roomKey = params.get('room');
            if(roomKey) {
                joinTargetRoom(roomKey);
            }
        });
    </script>
</body>
</html>
