<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchRoom - Ultimate Cinema</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MQTT Real-time Engine -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        #chatMessages::-webkit-scrollbar, #queueList::-webkit-scrollbar { width: 4px; }
        #chatMessages::-webkit-scrollbar-thumb, #queueList::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* Floating Emoji Animation */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            50% { transform: translateY(-130px) scale(1.4) rotate(12deg); opacity: 0.9; }
            100% { transform: translateY(-260px) scale(1) rotate(-12deg); opacity: 0; }
        }
        .floating-emoji {
            position: absolute;
            bottom: 30px;
            font-size: 2.2rem;
            pointer-events: none;
            animation: floatUp 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            z-index: 50;
        }

        /* Cinema Mode Hide Overlay */
        .cinema-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 0.3s ease-in-out;
        }
        .cinema-visible {
            opacity: 1 !important;
            pointer-events: auto !important;
            transition: opacity 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased select-none">

    <!-- Top Header -->
    <header id="mainAppHeader" class="p-3 sm:p-4 border-b border-slate-800 bg-slate-900/90 backdrop-blur flex justify-between items-center sticky top-0 z-40 transition-opacity duration-300">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-film text-rose-500 text-xl"></i>
            <span class="text-xl font-black tracking-tight text-white">Watch<span class="text-rose-500">Room</span></span>
        </div>
        
        <div class="flex items-center gap-2">
            <button onclick="promptChangeName()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs font-semibold text-slate-300 flex items-center gap-1 transition cursor-pointer">
                <i class="fa-solid fa-user-pen text-rose-400"></i> <span id="topUsernameDisplay">You</span>
            </button>
            <div id="connStatusBadge" class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span id="connStatusText">Active</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col items-center justify-center p-2 sm:p-6 w-full max-w-4xl mx-auto">
        
        <!-- 1. SETUP / ROOM CREATOR SCREEN -->
        <div id="setupScreen" class="w-full max-w-md bg-slate-900 p-6 sm:p-8 rounded-2xl border border-slate-800 shadow-2xl space-y-6 my-auto">
            <div class="text-center space-y-1">
                <h2 class="text-xl font-black text-white">Ultimate Watch Room</h2>
                <p class="text-xs text-slate-400">Synced Video, Live Voice, Emojis, Polls & Playlist</p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Your Name (for Chat & Voice):</label>
                <input type="text" id="setupUsernameInput" placeholder="e.g. Wajahat" 
                       class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-xs focus:outline-none focus:border-rose-500 text-white placeholder-slate-500 font-medium">
            </div>

            <div class="space-y-1">
                <label class="block text-xs font-semibold text-slate-400 mb-1">YouTube or Direct Video URL (.mp4):</label>
                <input type="text" id="videoUrlInput" placeholder="https://www.youtube.com/watch?v=..." 
                       class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700 text-xs focus:outline-none focus:border-rose-500 text-white placeholder-slate-500">
            </div>

            <button id="createRoomBtn" onclick="handleCreateWatchRoom()" class="w-full py-3.5 bg-rose-600 hover:bg-rose-700 font-bold rounded-xl text-sm transition shadow-lg shadow-rose-600/30 flex items-center justify-center gap-2 active:scale-95 cursor-pointer">
                <i class="fa-solid fa-play"></i> Launch Room & Share Link
            </button>

            <div class="pt-4 border-t border-slate-800 flex items-center gap-2">
                <input type="text" id="manualJoinCode" placeholder="Have a Room Code? Paste here..." 
                       class="flex-1 p-2.5 rounded-lg bg-slate-800/80 border border-slate-700 text-xs text-white focus:outline-none focus:border-rose-500">
                <button onclick="handleManualJoin()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg border border-slate-700 transition cursor-pointer">
                    Join
                </button>
            </div>
        </div>

        <!-- 2. WATCH ROOM THEATER SCREEN -->
        <div id="theaterScreen" class="w-full max-w-4xl flex-col items-center hidden space-y-3">
            
            <!-- Room Controls Bar -->
            <div id="theaterTopBar" class="w-full bg-slate-900 p-3 sm:p-4 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-2.5 shadow-lg transition-opacity duration-300">
                <div class="flex items-center gap-2 sm:gap-3">
                    <span id="roleBadge" class="text-xs font-bold px-2.5 py-1 rounded-md bg-rose-500/20 text-rose-400 border border-rose-500/30">Host</span>
                    <div>
                        <div class="text-[10px] uppercase font-bold tracking-wider text-slate-500">Room Code</div>
                        <div id="displayKey" class="text-xs font-mono font-bold text-slate-200">Loading...</div>
                    </div>
                </div>

                <div class="flex items-center gap-1.5 sm:gap-2">
                    <!-- Host Only Lock Toggle -->
                    <button id="hostControlToggleBtn" onclick="toggleHostControlLock()" class="hidden px-2.5 sm:px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg border border-slate-700 text-slate-300 transition items-center gap-1.5 cursor-pointer">
                        <i id="lockIcon" class="fa-solid fa-lock-open text-emerald-400"></i> <span id="lockText" class="hidden sm:inline">All Control</span>
                    </button>

                    <!-- Features Hub Button -->
                    <button onclick="openFeaturesModal()" class="px-2.5 sm:px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-xs font-bold rounded-lg transition flex items-center gap-1 shadow-sm active:scale-95 cursor-pointer">
                        <i class="fa-solid fa-layer-group"></i> <span>Tools</span>
                    </button>

                    <button onclick="shareOrCopyLink()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-xs font-bold rounded-lg transition flex items-center gap-1 shadow-sm active:scale-95 cursor-pointer">
                        <i class="fa-solid fa-share-nodes"></i> <span class="hidden sm:inline">Share</span>
                    </button>
                    <button onclick="leaveRoom()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition cursor-pointer">
                        Exit
                    </button>
                </div>
            </div>

            <!-- Video Player Box with Cinema Ambient Glow -->
            <div class="relative w-full">
                <div class="absolute inset-0 bg-gradient-to-r from-rose-600/15 via-indigo-600/15 to-purple-600/15 blur-3xl -z-10 rounded-3xl"></div>

                <div id="videoContainerBox" class="w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl relative border border-slate-800 flex items-center justify-center">
                    
                    <div id="ytPlayer" class="w-full h-full pointer-events-auto"></div>
                    <video id="nativePlayer" class="w-full h-full hidden" playsinline></video>

                    <!-- Subtitles Overlay -->
                    <div id="subtitleDisplay" class="absolute bottom-6 left-4 right-4 text-center pointer-events-none z-30 text-white font-bold text-sm sm:text-base drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]"></div>

                    <!-- Floating Emojis Canvas Overlay -->
                    <div id="emojiOverlayArea" class="absolute inset-0 pointer-events-none overflow-hidden z-30"></div>

                    <!-- Screen Tap Catcher to Toggle Controls (Cinema Mode) -->
                    <div id="screenTapCatcher" onclick="handleScreenTap(event)" class="absolute inset-0 z-20 cursor-pointer"></div>

                    <!-- Floating Quick Actions Inside Video Player -->
                    <div id="inVideoOverlayControls" class="absolute top-3 right-3 z-30 flex items-center gap-1.5 transition-opacity duration-300">
                        <!-- Picture in Picture (PiP) -->
                        <button onclick="togglePiP()" title="Picture-in-Picture" class="bg-black/60 hover:bg-black/90 text-white w-8 h-8 rounded-lg flex items-center justify-center transition border border-white/10 backdrop-blur cursor-pointer">
                            <i class="fa-solid fa-clone text-xs"></i>
                        </button>
                        <!-- Smart Fullscreen with Landscape Lock -->
                        <button onclick="toggleSmartFullscreen()" title="Smart Fullscreen" class="bg-black/60 hover:bg-black/90 text-white w-8 h-8 rounded-lg flex items-center justify-center transition border border-white/10 backdrop-blur cursor-pointer">
                            <i id="fullscreenIcon" class="fa-solid fa-expand text-xs"></i>
                        </button>
                    </div>

                    <!-- Mobile Autoplay Unlock Overlay -->
                    <div id="syncOverlay" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center gap-3 z-40 hidden p-4 text-center">
                        <div class="w-16 h-16 rounded-full bg-rose-600 flex items-center justify-center text-white text-2xl shadow-xl shadow-rose-600/50 animate-bounce cursor-pointer" onclick="unlockPlayback()">
                            <i class="fa-solid fa-play ml-1"></i>
                        </div>
                        <h3 class="text-base font-bold text-white">Tap to Start Watching</h3>
                        <button onclick="unlockPlayback()" class="px-6 py-2 bg-rose-600 text-white font-bold rounded-xl text-xs transition cursor-pointer">
                            Watch Together
                        </button>
                    </div>
                </div>
            </div>

            <!-- LIVE EMOJI & PUSH-TO-TALK MIC BAR -->
            <div id="emojiReactionToolBar" class="w-full bg-slate-900/80 border border-slate-800/90 p-2 rounded-xl flex items-center justify-between gap-1 shadow-md backdrop-blur transition-opacity duration-300">
                <div class="flex items-center gap-2 sm:gap-3 flex-1 justify-around">
                    <button onclick="sendEmojiReaction('❤️')" class="text-xl sm:text-2xl hover:scale-125 transition active:scale-95 cursor-pointer">❤️</button>
                    <button onclick="sendEmojiReaction('😂')" class="text-xl sm:text-2xl hover:scale-125 transition active:scale-95 cursor-pointer">😂</button>
                    <button onclick="sendEmojiReaction('🔥')" class="text-xl sm:text-2xl hover:scale-125 transition active:scale-95 cursor-pointer">🔥</button>
                    <button onclick="sendEmojiReaction('😱')" class="text-xl sm:text-2xl hover:scale-125 transition active:scale-95 cursor-pointer">😱</button>
                    <button onclick="sendEmojiReaction('🍿')" class="text-xl sm:text-2xl hover:scale-125 transition active:scale-95 cursor-pointer">🍿</button>
                    <button onclick="sendEmojiReaction('👏')" class="text-xl sm:text-2xl hover:scale-125 transition active:scale-95 cursor-pointer">👏</button>
                </div>
                
                <!-- Push-to-Talk Live Mic Button -->
                <button id="pushToTalkBtn" onmousedown="startVoiceRecording()" onmouseup="stopVoiceRecording()" ontouchstart="startVoiceRecording()" ontouchend="stopVoiceRecording()" 
                        class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-rose-600/30 cursor-pointer">
                    <i id="micIcon" class="fa-solid fa-microphone"></i> <span id="micText">Hold Mic</span>
                </button>
            </div>

            <!-- Synchronized Quick Controls Bar -->
            <div id="controlsContainerBar" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between gap-2 shadow-md transition-opacity duration-300">
                <div class="flex items-center gap-2">
                    <button id="btnSeekBack" onclick="userSeekDelta(-10)" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-200 border border-slate-700 flex items-center gap-1 transition active:scale-95 cursor-pointer">
                        <i class="fa-solid fa-rotate-left"></i> -10s
                    </button>
                    <button id="togglePlayBtn" onclick="userTogglePlay()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 rounded-lg text-xs font-bold text-white flex items-center gap-1.5 transition active:scale-95 shadow-lg shadow-rose-600/20 cursor-pointer">
                        <i id="playIcon" class="fa-solid fa-pause"></i> <span id="playText">Pause</span>
                    </button>
                    <button id="btnSeekForward" onclick="userSeekDelta(10)" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-200 border border-slate-700 flex items-center gap-1 transition active:scale-95 cursor-pointer">
                        +10s <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>

                <div class="flex items-center gap-1.5">
                    <span class="text-[11px] font-bold text-slate-400 hidden sm:inline">Speed:</span>
                    <select id="speedSelect" onchange="userChangeSpeed(this.value)" class="bg-slate-800 text-slate-200 text-xs font-bold py-2 px-2.5 rounded-lg border border-slate-700 focus:outline-none focus:border-rose-500">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2.0x</option>
                    </select>
                </div>
            </div>

            <!-- Group Chat Section -->
            <div id="chatSectionBox" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col h-72 transition-opacity duration-300">
                <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-2">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-comments text-rose-500 text-sm"></i>
                        <span class="text-xs sm:text-sm font-bold text-white">Live Discussion & Voice</span>
                    </div>
                    <span id="chatLockNotice" class="text-[10px] text-slate-500 font-medium">All Members Synced</span>
                </div>
                <div id="chatMessages" class="flex-1 overflow-y-auto space-y-2.5 pr-1"></div>
                <form onsubmit="handleSendChat(event)" class="mt-3 flex gap-2">
                    <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off"
                           class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 transition">
                    <button type="submit" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 shadow-md shadow-rose-600/30 cursor-pointer">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>

        </div>

    </main>

    <!-- TOOLS MODAL (Playlist, Change Video, Polls, Subtitles) -->
    <div id="featuresModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 space-y-5 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-toolbox text-rose-500"></i> Cinema Tools Hub
                </h3>
                <button onclick="closeFeaturesModal()" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Tab Switcher -->
            <div class="flex border-b border-slate-800 text-xs font-bold">
                <button onclick="switchToolsTab('change')" id="toolTabChange" class="flex-1 pb-2 text-rose-500 border-b-2 border-rose-500">Change Video</button>
                <button onclick="switchToolsTab('playlist')" id="toolTabPlaylist" class="flex-1 pb-2 text-slate-400 border-b-2 border-transparent">Queue</button>
                <button onclick="switchToolsTab('poll')" id="toolTabPoll" class="flex-1 pb-2 text-slate-400 border-b-2 border-transparent">Poll</button>
                <button onclick="switchToolsTab('subs')" id="toolTabSubs" class="flex-1 pb-2 text-slate-400 border-b-2 border-transparent">Subtitles</button>
            </div>

            <!-- Change Video Section -->
            <div id="toolSecChange" class="space-y-3">
                <label class="block text-xs text-slate-400">Switch movie right now for everyone:</label>
                <input type="text" id="changeVideoUrlInput" placeholder="New YouTube or MP4 link..." class="w-full p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none focus:border-rose-500">
                <button onclick="submitChangeVideoNow()" class="w-full py-2 bg-rose-600 hover:bg-rose-700 rounded-lg text-xs font-bold text-white transition">
                    Switch Video Now
                </button>
            </div>

            <!-- Playlist / Queue Section -->
            <div id="toolSecPlaylist" class="space-y-3 hidden">
                <div class="flex gap-2">
                    <input type="text" id="queueVideoInput" placeholder="Add next video link..." class="flex-1 p-2 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white">
                    <button onclick="addToPlaylistQueue()" class="px-3 bg-indigo-600 hover:bg-indigo-700 rounded-lg text-xs font-bold text-white">Add</button>
                </div>
                <div class="text-[11px] font-bold text-slate-400">Up Next Queue:</div>
                <div id="queueList" class="max-h-36 overflow-y-auto space-y-1.5 text-xs">
                    <div class="text-slate-500 text-center py-4 text-xs">No upcoming videos in queue.</div>
                </div>
            </div>

            <!-- Poll Section -->
            <div id="toolSecPoll" class="space-y-3 hidden">
                <input type="text" id="pollQuestionInput" placeholder="Poll Question: e.g. Which movie next?" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white">
                <input type="text" id="pollOpt1Input" placeholder="Option A: e.g. Action" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white">
                <input type="text" id="pollOpt2Input" placeholder="Option B: e.g. Comedy" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white">
                <button onclick="startRoomPoll()" class="w-full py-2 bg-rose-600 hover:bg-rose-700 rounded-lg text-xs font-bold text-white transition">Launch Live Poll</button>
            </div>

            <!-- Subtitles Section -->
            <div id="toolSecSubs" class="space-y-3 hidden">
                <label class="block p-4 border-2 border-dashed border-slate-700 hover:border-rose-500 rounded-xl text-center cursor-pointer transition">
                    <i class="fa-solid fa-closed-captioning text-rose-500 text-2xl mb-1"></i>
                    <div class="text-xs font-semibold text-slate-300">Upload .SRT Subtitle File</div>
                    <input type="file" accept=".srt" class="hidden" onchange="handleSubtitlesUpload(event)">
                </label>
                <div id="activeSubFileName" class="text-xs text-center text-emerald-400 font-semibold"></div>
            </div>
        </div>
    </div>

    <!-- LIVE ACTIVE POLL BANNER (When poll is launched) -->
    <div id="activePollModal" class="hidden fixed bottom-6 left-4 right-4 sm:left-auto sm:right-6 sm:w-80 bg-slate-900 border-2 border-rose-500 rounded-2xl p-4 shadow-2xl z-50 space-y-3">
        <div class="flex justify-between items-start">
            <h4 id="activePollTitle" class="text-xs font-bold text-white">Live Poll</h4>
            <button onclick="closeActivePollUI()" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="space-y-2">
            <button onclick="castPollVote(1)" class="w-full p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-left text-xs font-semibold flex justify-between relative overflow-hidden">
                <div id="pollOpt1Bar" class="absolute inset-y-0 left-0 bg-rose-600/30 transition-all duration-300 w-0"></div>
                <span id="pollOpt1Text" class="relative z-10">Option A</span>
                <span id="pollOpt1Pct" class="relative z-10 font-mono">0%</span>
            </button>
            <button onclick="castPollVote(2)" class="w-full p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-left text-xs font-semibold flex justify-between relative overflow-hidden">
                <div id="pollOpt2Bar" class="absolute inset-y-0 left-0 bg-rose-600/30 transition-all duration-300 w-0"></div>
                <span id="pollOpt2Text" class="relative z-10">Option B</span>
                <span id="pollOpt2Pct" class="relative z-10 font-mono">0%</span>
            </button>
        </div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        /*************************************************************
         * 1. STATE & ENGINE INITIALIZATION
         *************************************************************/
        const myClientId = 'client_' + Math.random().toString(36).substring(2, 9);
        let mqttClient = null;
        let isHost = false;
        let currentRoomId = null;

        let myNickname = localStorage.getItem('wt_my_name') || 'Guest';
        let isHostOnlyControl = false;
        let areControlsHidden = false;

        let currentMediaType = 'youtube';
        let currentMediaSource = null;
        let videoQueue = [];
        let parsedSubtitles = [];

        let mediaRecorder = null;
        let audioChunks = [];
        let activePollData = null;

        let ytPlayer = null;
        let isInternalSync = false;
        let lastReportedTime = 0;

        const nameColors = ['text-rose-400', 'text-sky-400', 'text-amber-400', 'text-emerald-400', 'text-purple-400', 'text-pink-400'];
        const myColor = nameColors[Math.floor(Math.random() * nameColors.length)];

        function updateConnStatus(text, status) {
            const badge = document.getElementById('connStatusBadge');
            const txt = document.getElementById('connStatusText');
            if(txt) txt.innerText = text;

            if(status === 'connected') {
                badge.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> <span>${text}</span>`;
            } else if(status === 'connecting') {
                badge.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> <span>${text}</span>`;
            } else {
                badge.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-400"></span> <span>${text}</span>`;
            }
        }

        function promptChangeName() {
            const newName = prompt("Enter your name for the room:", myNickname);
            if(newName && newName.trim()) {
                myNickname = newName.trim().substring(0, 15);
                localStorage.setItem('wt_my_name', myNickname);
                document.getElementById('topUsernameDisplay').innerText = myNickname;
            }
        }

        function getYouTubeId(url) {
            if(!url) return null;
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        /*************************************************************
         * 2. REAL-TIME NETWORKING (MQTT)
         *************************************************************/
        function connectRealtimeNetwork(roomId) {
            updateConnStatus("Connecting...", "connecting");

            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                clientId: myClientId,
                clean: true,
                keepalive: 30,
                connectTimeout: 5000,
                reconnectPeriod: 1000
            });

            const topic = 'watchroom/room_' + roomId;

            mqttClient.on('connect', () => {
                updateConnStatus("Active", "connected");
                mqttClient.subscribe(topic, (err) => {
                    if(!err && !isHost) {
                        sendRealtimeSignal({ type: 'REQUEST_SYNC' });
                    }
                });
            });

            mqttClient.on('message', (t, payload) => {
                try {
                    const data = JSON.parse(payload.toString());
                    if(data.senderId === myClientId) return;
                    handleIncomingSignal(data);
                } catch(e) {
                    console.error("Signal error:", e);
                }
            });

            mqttClient.on('error', () => {
                if(document.visibilityState === 'visible') updateConnStatus("Reconnecting...", "connecting");
            });
            mqttClient.on('offline', () => {
                if(document.visibilityState === 'visible') updateConnStatus("Reconnecting...", "connecting");
            });
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && currentRoomId) {
                if (!mqttClient || !mqttClient.connected) {
                    updateConnStatus("Reconnecting...", "connecting");
                    try {
                        if (mqttClient) mqttClient.reconnect();
                        else connectRealtimeNetwork(currentRoomId);
                    } catch(e) {
                        connectRealtimeNetwork(currentRoomId);
                    }
                } else {
                    updateConnStatus("Active", "connected");
                    const topic = 'watchroom/room_' + currentRoomId;
                    mqttClient.subscribe(topic);
                    if (!isHost) sendRealtimeSignal({ type: 'REQUEST_SYNC' });
                }
            }
        });

        function sendRealtimeSignal(data) {
            if(mqttClient && mqttClient.connected && currentRoomId) {
                data.senderId = myClientId;
                const topic = 'watchroom/room_' + currentRoomId;
                mqttClient.publish(topic, JSON.stringify(data));
            }
        }

        /*************************************************************
         * 4. REAL-TIME SIGNAL HANDLERS
         *************************************************************/
        function handleIncomingSignal(data) {
            if(data.type === 'EMOJI_REACTION') {
                displayFloatingEmoji(data.emoji);
                return;
            }

            if(data.type === 'VOICE_MSG') {
                playReceivedVoiceNote(data);
                return;
            }

            if(data.type === 'POLL_START') {
                receivePollStart(data);
                return;
            }

            if(data.type === 'POLL_VOTE_UPDATE') {
                updatePollVoteUI(data);
                return;
            }

            if(data.type === 'SWITCH_VIDEO') {
                currentMediaSource = data.url;
                currentMediaType = getYouTubeId(data.url) ? 'youtube' : 'direct';
                setupPlayer(currentMediaSource);
                return;
            }

            if(data.type === 'UPDATE_QUEUE') {
                videoQueue = data.queue || [];
                renderQueueUI();
                return;
            }

            if(data.type === 'SET_SUBS') {
                parsedSubtitles = data.subs || [];
                return;
            }

            if(data.type === 'HOST_LOCK_UPDATE') {
                isHostOnlyControl = data.isLocked;
                applyHostLockUI(data.isLocked);
                return;
            }

            if(data.type === 'CHAT_MSG') {
                appendChatMessage({ sender: data.sender, text: data.text, time: data.time, color: data.color, isMe: false });
                return;
            }

            if(data.type === 'REQUEST_SYNC' && isHost) {
                sendRealtimeSignal({
                    type: 'INIT_STATE',
                    mediaType: currentMediaType,
                    mediaSource: currentMediaSource,
                    time: getCurrentTime(),
                    isPlaying: isPlayerPlaying(),
                    speed: getCurrentSpeed(),
                    isLocked: isHostOnlyControl,
                    queue: videoQueue
                });
                return;
            }

            isInternalSync = true;

            if(data.type === 'INIT_STATE') {
                currentMediaType = data.mediaType;
                currentMediaSource = data.mediaSource;
                isHostOnlyControl = !!data.isLocked;
                videoQueue = data.queue || [];
                applyHostLockUI(isHostOnlyControl);
                renderQueueUI();

                setupPlayer(data.mediaSource, () => {
                    seekToTime(data.time);
                    setPlaybackRate(data.speed || 1);
                    if(data.isPlaying) playVideo(); else pauseVideo();
                });
            } else if(data.type === 'PLAY') {
                seekToTime(data.time);
                playVideo();
                updatePlayPauseButton(true);
            } else if(data.type === 'PAUSE') {
                seekToTime(data.time);
                pauseVideo();
                updatePlayPauseButton(false);
            } else if(data.type === 'SEEK') {
                seekToTime(data.time);
            } else if(data.type === 'RATE') {
                setPlaybackRate(data.rate);
            }

            setTimeout(() => { isInternalSync = false; }, 600);
        }

        /*************************************************************

        async function startVoiceRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64Audio = reader.result;
                        sendRealtimeSignal({
                            type: 'VOICE_MSG',
                            audio: base64Audio,
                            sender: myNickname,
                            color: myColor
                        });
                        playVoiceAudioClip(base64Audio);
                        appendVoiceChatBubble(myNickname, true, myColor);
                    };
                    reader.readAsDataURL(blob);
                };
                mediaRecorder.start();
                document.getElementById('micText').innerText = "Recording...";
                document.getElementById('pushToTalkBtn').classList.add('animate-pulse', 'bg-red-600');
            } catch(e) {
                alert("Microphone permission required for voice notes!");
            }
        }

        function stopVoiceRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                document.getElementById('micText').innerText = "Hold Mic";
                document.getElementById('pushToTalkBtn').classList.remove('animate-pulse', 'bg-red-600');
            }
        }

        // Subtitles .SRT Parser
        function handleSubtitlesUpload(e) {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                parsedSubtitles = parseSRT(event.target.result);
                document.getElementById('activeSubFileName').innerText = `Active: ${file.name}`;
                sendRealtimeSignal({ type: 'SET_SUBS', subs: parsedSubtitles });
                alert("Subtitles loaded & synced for all friends!");
            };
            reader.readAsText(file);
        }

        function parseSRT(text) {
            const regex = /(\d+)\r?\n(\d{2}:\d{2}:\d{2}[,\.]\d{3}) --> (\d{2}:\d{2}:\d{2}[,\.]\d{3})\r?\n([\s\S]*?)(?=\r?\n\r?\n|\n\n|$)/g;
            let match;
            const subs = [];
            while ((match = regex.exec(text)) !== null) {
                subs.push({
                    start: timeToSeconds(match[2]),
                    end: timeToSeconds(match[3]),
                    text: match[4].replace(/\r?\n/g, '<br>')
                });
            }
            return subs;
        }

        function timeToSeconds(t) {
            const parts = t.replace(',', '.').split(':');
            return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
        }

        function setupPlayer(url, callback) {
            const ytId = getYouTubeId(url);
            const nativeVideo = document.getElementById('nativePlayer');
            const ytDiv = document.getElementById('ytPlayer');

            if(ytId) {
                currentMediaType = 'youtube';
                nativeVideo.classList.add('hidden');
                ytDiv.classList.remove('hidden');

                const attachYT = () => {
                    if(ytPlayer && ytPlayer.loadVideoById) {
                        ytPlayer.loadVideoById(ytId);
                        if(callback) callback();
                    } else {
                        ytPlayer = new YT.Player('ytPlayer', {
                            videoId: ytId,
                            playerVars: { 'autoplay': 0, 'controls': 1, 'playsinline': 1 },
                            events: {
                                'onReady': () => { if(callback) callback(); },
                                'onStateChange': onYouTubeStateChange
                            }
                        });
                    }
                };

                if(window.YT && window.YT.Player) attachYT();
                else {
                    const timer = setInterval(() => {
                        if(window.YT && window.YT.Player) {
                            clearInterval(timer);
                            attachYT();
                        }
                    }, 150);
                }
            } else {
                currentMediaType = 'direct';
                ytDiv.classList.add('hidden');
                nativeVideo.classList.remove('hidden');
                nativeVideo.src = url;

                nativeVideo.onplay = () => {
                    updatePlayPauseButton(true);
                    if(!isInternalSync) sendRealtimeSignal({ type: 'PLAY', time: nativeVideo.currentTime });
                };
                nativeVideo.onpause = () => {
                    updatePlayPauseButton(false);
                    if(!isInternalSync) sendRealtimeSignal({ type: 'PAUSE', time: nativeVideo.currentTime });
                };
                nativeVideo.onseeked = () => {
                    if(!isInternalSync) sendRealtimeSignal({ type: 'SEEK', time: nativeVideo.currentTime });
                };
                nativeVideo.onratechange = () => {
                    if(!isInternalSync) sendRealtimeSignal({ type: 'RATE', rate: nativeVideo.playbackRate });
                };
                nativeVideo.onended = () => {
                    if(isHost) autoPlayNextInQueue();
                };

                if(callback) callback();
            }
        }

        function onYouTubeStateChange(e) {
            if(e.data === YT.PlayerState.ENDED && isHost) {
                autoPlayNextInQueue();
                return;
            }
            if(isInternalSync) return;
            const time = ytPlayer.getCurrentTime();
            if(e.data === YT.PlayerState.PLAYING) {
                updatePlayPauseButton(true);
                sendRealtimeSignal({ type: 'PLAY', time: time });
            } else if(e.data === YT.PlayerState.PAUSED) {
                updatePlayPauseButton(false);
                sendRealtimeSignal({ type: 'PAUSE', time: time });
            }
        }

        // Subtitles check & seek check loop (every 300ms)
        setInterval(() => {
            const curTime = getCurrentTime();

            // Subtitle Display
            if(parsedSubtitles.length > 0) {
                const sub = parsedSubtitles.find(s => curTime >= s.start && curTime <= s.end);
                document.getElementById('subtitleDisplay').innerHTML = sub ? sub.text : '';
            }

            if(isInternalSync) return;
            if(Math.abs(curTime - lastReportedTime) > 1.8 && isPlayerPlaying()) {
                sendRealtimeSignal({ type: 'SEEK', time: curTime });
            }
            lastReportedTime = curTime;
        }, 300);

        function userChangeSpeed(val) {
            if(!isHost && isHostOnlyControl) return;
            const rate = parseFloat(val);
            setPlaybackRate(rate);
            sendRealtimeSignal({ type: 'RATE', rate: rate });
        }

        function updatePlayPauseButton(isPlaying) {
            const icon = document.getElementById('playIcon');
            const text = document.getElementById('playText');
            if(isPlaying) {
                icon.className = "fa-solid fa-pause";
                text.innerText = "Pause";
            } else {
                icon.className = "fa-solid fa-play";
                text.innerText = "Play";
            }
        }

        function playVideo() {
            try {
                if(currentMediaType === 'youtube' && ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
                else document.getElementById('nativePlayer').play();
                updatePlayPauseButton(true);
            } catch(e) {
                document.getElementById('syncOverlay').classList.remove('hidden');
            }
        }

        function pauseVideo() {
            if(currentMediaType === 'youtube' && ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
            else document.getElementById('nativePlayer').pause();
            updatePlayPauseButton(false);
        }

        function seekToTime(seconds) {
            if(currentMediaType === 'youtube' && ytPlayer && ytPlayer.seekTo) ytPlayer.seekTo(seconds, true);
            else document.getElementById('nativePlayer').currentTime = seconds;
            lastReportedTime = seconds;
        }

        function setPlaybackRate(rate) {
            document.getElementById('speedSelect').value = rate;
            if(currentMediaType === 'youtube' && ytPlayer && ytPlayer.setPlaybackRate) ytPlayer.setPlaybackRate(rate);
            else document.getElementById('nativePlayer').playbackRate = rate;
        }

        function getCurrentTime() {
            if(currentMediaType === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) return ytPlayer.getCurrentTime();
            return document.getElementById('nativePlayer').currentTime || 0;
        }

        function getCurrentSpeed() {
            return parseFloat(document.getElementById('speedSelect').value) || 1;
        }

        function isPlayerPlaying() {
            if(currentMediaType === 'youtube' && ytPlayer && ytPlayer.getPlayerState) {
                return ytPlayer.getPlayerState() === YT.PlayerState.PLAYING;
            }
            const nat = document.getElementById('nativePlayer');
            return !!(nat.currentTime > 0 && !nat.paused && !nat.ended && nat.readyState > 2);
        }

        function unlockPlayback() {
            document.getElementById('syncOverlay').classList.add('hidden');
            playVideo();
            sendRealtimeSignal({ type: 'REQUEST_SYNC' });
        }

        // Live Chat Handlers
        function handleSendChat(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            appendChatMessage({ sender: myNickname, text: text, time: timeStr, color: myColor, isMe: true });

            sendRealtimeSignal({ type: 'CHAT_MSG', sender: myNickname, text: text, time: timeStr, color: myColor });
            input.value = '';
        }

        function appendChatMessage(data) {
            const container = document.getElementById('chatMessages');
            const row = document.createElement('div');
            row.className = data.isMe ? 'flex flex-col items-end' : 'flex flex-col items-start';

            const bubble = document.createElement('div');
            bubble.className = data.isMe 
                ? 'bg-rose-600 text-white rounded-2xl rounded-tr-none px-3.5 py-2 text-xs max-w-[85%] break-words shadow-md' 
                : 'bg-slate-800 text-slate-100 border border-slate-700 rounded-2xl rounded-tl-none px-3.5 py-2 text-xs max-w-[85%] break-words shadow-md';
            bubble.innerText = data.text;

            const meta = document.createElement('div');
            meta.className = `text-[9px] mt-1 px-1 font-semibold ${data.color || 'text-slate-400'}`;
            meta.innerText = `${data.sender} • ${data.time}`;

            row.appendChild(bubble);
            row.appendChild(meta);
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function showTheaterScreen(isHostRole) {
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('theaterScreen').classList.remove('hidden');

            const badge = document.getElementById('roleBadge');
            badge.innerText = isHostRole ? "Host" : "Guest";
            badge.className = isHostRole 
                ? "text-xs font-bold px-2.5 py-1 rounded-md bg-rose-500/20 text-rose-400 border border-rose-500/30" 
                : "text-xs font-bold px-2.5 py-1 rounded-md bg-blue-500/20 text-blue-400 border border-blue-500/30";

            if(isHostRole) {
                document.getElementById('hostControlToggleBtn').classList.remove('hidden');
                document.getElementById('hostControlToggleBtn').classList.add('flex');
            }
        }

        function shareOrCopyLink() {
            if(currentRoomId && currentMediaSource) {
                const url = `${window.location.protocol}//${window.location.host}${window.location.pathname}?room=${currentRoomId}&v=${encodeURIComponent(currentMediaSource)}&type=${currentMediaType}`;
                
                if (navigator.share) {
                    navigator.share({
                        title: 'Join my WatchRoom',
                        text: 'Watch this movie with me in sync!',
                        url: url
                    }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(url).then(() => {
                        alert("Room link copied! Share with friends.");
                    });
                }
            }
        }

        function leaveRoom() {
            if(confirm("Do you want to exit the room?")) {
                window.location.href = window.location.pathname;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const rKey = params.get('room');
            const vUrl = params.get('v');
            const vType = params.get('type');

            if(rKey) {
                joinRoomDirectly(rKey, vUrl, vType);
            }
        });
    </script>
</body>
</html>
