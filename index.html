<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchRoom - Synchronized Movie Room</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        #chatMessages::-webkit-scrollbar { width: 4px; }
        #chatMessages::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased select-none">

    <!-- Header -->
    <header class="p-3 sm:p-4 border-b border-slate-800 bg-slate-900/90 backdrop-blur flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-film text-rose-500 text-xl"></i>
            <span class="text-xl font-black tracking-tight text-white">Watch<span class="text-rose-500">Room</span></span>
        </div>
        
        <div class="flex items-center gap-2">
            <div id="connStatusBadge" class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span id="connStatusText">Ready</span>
            </div>
            <div id="roomMemberBadge" class="hidden flex items-center gap-1.5 bg-slate-800 px-3 py-1 rounded-full border border-slate-700 text-xs font-bold text-slate-300">
                <span id="memberCountText">👥 1/6</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col items-center justify-center p-3 sm:p-6 w-full max-w-4xl mx-auto">
        
        <!-- 1. SETUP / ROOM CREATOR SCREEN -->
        <div id="setupScreen" class="w-full max-w-md bg-slate-900 p-6 sm:p-8 rounded-2xl border border-slate-800 shadow-2xl space-y-6">
            
            <div class="text-center space-y-1">
                <h2 class="text-lg font-black text-white">Create a Watch Room</h2>
                <p class="text-xs text-slate-400">Watch together with up to 6 friends</p>
            </div>

            <!-- Video Link Input -->
            <div class="space-y-1">
                <label class="block text-xs font-semibold text-slate-400 mb-1">YouTube or Video URL (.mp4):</label>
                <input type="text" id="videoUrlInput" placeholder="https://www.youtube.com/watch?v=..." 
                       class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700 text-xs focus:outline-none focus:border-rose-500 text-white placeholder-slate-500">
            </div>

            <!-- Create Room Button -->
            <button id="createRoomBtn" onclick="handleCreateWatchRoom()" class="w-full py-3.5 bg-rose-600 hover:bg-rose-700 font-bold rounded-xl text-sm transition shadow-lg shadow-rose-600/30 flex items-center justify-center gap-2 active:scale-95 cursor-pointer">
                <i class="fa-solid fa-play"></i> Create Room & Copy Invite Link
            </button>

            <!-- Manual Room Code Box -->
            <div class="pt-4 border-t border-slate-800 flex items-center gap-2">
                <input type="text" id="manualJoinCode" placeholder="Have a Room Code? Paste here..." 
                       class="flex-1 p-2.5 rounded-lg bg-slate-800/80 border border-slate-700 text-xs text-white focus:outline-none focus:border-rose-500">
                <button onclick="handleManualJoin()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg border border-slate-700 transition cursor-pointer">
                    Join
                </button>
            </div>

        </div>

        <!-- 2. WATCH ROOM THEATER SCREEN -->
        <div id="theaterScreen" class="w-full max-w-4xl flex-col items-center hidden space-y-3">
            
            <!-- Controls Bar -->
            <div class="w-full bg-slate-900 p-3 sm:p-4 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-3 shadow-lg">
                <div class="flex items-center gap-3">
                    <span id="roleBadge" class="text-xs font-bold px-2.5 py-1 rounded-md bg-rose-500/20 text-rose-400 border border-rose-500/30">Host</span>
                    <div>
                        <div class="text-[10px] uppercase font-bold tracking-wider text-slate-500">Room Code</div>
                        <div id="displayKey" class="text-xs font-mono font-bold text-slate-200">Generating...</div>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="copyFullLink()" class="px-3.5 py-1.5 bg-rose-600 hover:bg-rose-700 text-xs font-bold rounded-lg transition flex items-center gap-1.5 shadow-sm active:scale-95 cursor-pointer">
                        <i class="fa-solid fa-share-nodes"></i> Share Link (Max 6)
                    </button>
                    <button onclick="leaveRoom()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition cursor-pointer">
                        Exit
                    </button>
                </div>
            </div>

            <!-- Video Player -->
            <div class="w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl relative border border-slate-800 flex items-center justify-center">
                <div id="ytPlayer" class="w-full h-full pointer-events-auto"></div>
                <video id="nativePlayer" class="w-full h-full hidden" playsinline></video>

                <!-- Mobile Autoplay Unlock Overlay -->
                <div id="syncOverlay" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center gap-3 z-30 hidden p-4 text-center">
                    <div class="w-16 h-16 rounded-full bg-rose-600 flex items-center justify-center text-white text-2xl shadow-xl shadow-rose-600/50 animate-bounce cursor-pointer" onclick="unlockPlayback()">
                        <i class="fa-solid fa-play ml-1"></i>
                    </div>
                    <h3 class="text-base font-bold text-white">Tap to Start Watching</h3>
                    <button onclick="unlockPlayback()" class="px-6 py-2 bg-rose-600 text-white font-bold rounded-xl text-xs transition cursor-pointer">
                        Watch Together
                    </button>
                </div>
            </div>

            <!-- Synchronized Quick Controls -->
            <div class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between gap-2 shadow-md">
                <div class="flex items-center gap-2">
                    <button onclick="userSeekDelta(-10)" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-200 border border-slate-700 flex items-center gap-1 transition active:scale-95 cursor-pointer">
                        <i class="fa-solid fa-rotate-left"></i> -10s
                    </button>
                    <button id="togglePlayBtn" onclick="userTogglePlay()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 rounded-lg text-xs font-bold text-white flex items-center gap-1.5 transition active:scale-95 shadow-lg shadow-rose-600/20 cursor-pointer">
                        <i id="playIcon" class="fa-solid fa-pause"></i> <span id="playText">Pause</span>
                    </button>
                    <button onclick="userSeekDelta(10)" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-200 border border-slate-700 flex items-center gap-1 transition active:scale-95 cursor-pointer">
                        +10s <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>

                <div class="flex items-center gap-1.5">
                    <span class="text-[11px] font-bold text-slate-400 hidden sm:inline">Speed:</span>
                    <select id="speedSelect" onchange="userChangeSpeed(this.value)" class="bg-slate-800 text-slate-200 text-xs font-bold py-2 px-2.5 rounded-lg border border-slate-700 focus:outline-none focus:border-rose-500">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2.0x</option>
                    </select>
                </div>
            </div>

            <!-- Group Chat -->
            <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col h-72">
                <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-2">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-comments text-rose-500 text-sm"></i>
                        <span class="text-xs sm:text-sm font-bold text-white">Room Discussion (Up to 6 friends)</span>
                    </div>
                    <span class="text-[10px] text-slate-500 font-medium">Synced</span>
                </div>
                <div id="chatMessages" class="flex-1 overflow-y-auto space-y-2.5 pr-1"></div>
                <form onsubmit="handleSendChat(event)" class="mt-3 flex gap-2">
                    <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off"
                           class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 transition">
                    <button type="submit" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 shadow-md shadow-rose-600/30 cursor-pointer">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>

        </div>

    </main>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const MAX_PEERS = 5;
        let peer = null;
        let isHost = false;
        let currentRoomId = null;

        let guestConnections = [];
        let hostConnection = null;

        let currentMediaType = 'youtube';
        let currentMediaSource = null;

        let ytPlayer = null;
        let isInternalSync = false;
        let lastReportedTime = 0;

        function updateConnStatus(text, status) {
            const badge = document.getElementById('connStatusBadge');
            const txt = document.getElementById('connStatusText');
            if(txt) txt.innerText = text;

            if(status === 'connected') {
                badge.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> <span>${text}</span>`;
            } else if(status === 'connecting') {
                badge.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> <span>${text}</span>`;
            } else {
                badge.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-400"></span> <span>${text}</span>`;
            }
        }

        function getYouTubeId(url) {
            if(!url) return null;
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Host creates room (INSTANT, NEVER FREEZES)
        function handleCreateWatchRoom() {
            const urlInput = document.getElementById('videoUrlInput').value.trim();
            if(!urlInput) return alert("Please paste a video URL first!");

            isHost = true;
            currentMediaSource = urlInput;
            currentMediaType = getYouTubeId(urlInput) ? 'youtube' : 'direct';

            // Show theater screen immediately
            showTheaterScreen(true);
            updateMemberBadge(1);
            setupPlayer(currentMediaSource);

            // Connect to Peer in background
            updateConnStatus("Connecting...", "connecting");
            peer = new Peer();

            peer.on('open', (id) => {
                currentRoomId = id;
                document.getElementById('displayKey').innerText = id;
                updateConnStatus("Ready", "connected");
                copyFullLink(); // Auto-copy invite link
            });

            peer.on('error', (err) => {
                console.warn("Peer error:", err);
                updateConnStatus("Offline", "disconnected");
            });

            setupHostListeners();
        }

        function setupHostListeners() {
            peer.on('connection', (c) => {
                if(guestConnections.length >= MAX_PEERS) {
                    c.on('open', () => { c.send({ type: 'ROOM_FULL' }); c.close(); });
                    return;
                }

                c.on('open', () => {
                    guestConnections.push(c);
                    updateMemberBadge(guestConnections.length + 1);

                    // Send current video & playback time to this guest
                    c.send({
                        type: 'INIT_STATE',
                        mediaType: currentMediaType,
                        mediaSource: currentMediaSource,
                        time: getCurrentTime(),
                        isPlaying: isPlayerPlaying(),
                        speed: getCurrentSpeed()
                    });

                    broadcastSystemMessage("A friend joined the room!");
                });

                c.on('data', (data) => {
                    handleIncomingSignal(data, c);
                });

                c.on('close', () => {
                    guestConnections = guestConnections.filter(g => g !== c);
                    updateMemberBadge(guestConnections.length + 1);
                    broadcastSystemMessage("A friend left the room.");
                });
            });
        }

        function handleManualJoin() {
            let key = document.getElementById('manualJoinCode').value.trim();
            if(!key) return alert("Please enter a Room Key or Link!");

            let vUrl = null, vType = null;
            if(key.includes('?')) {
                const params = new URLSearchParams(key.split('?')[1]);
                vUrl = params.get('v');
                vType = params.get('type');
                key = params.get('room') || key;
            }

            joinRoomDirectly(key, vUrl, vType);
        }

        // Guest joins directly from URL link (AUTOMATIC)
        function joinRoomDirectly(targetRoomId, videoUrl, videoType) {
            isHost = false;
            currentRoomId = targetRoomId;
            document.getElementById('displayKey').innerText = targetRoomId;

            showTheaterScreen(false);

            if(videoUrl) {
                currentMediaSource = decodeURIComponent(videoUrl);
                currentMediaType = videoType || (getYouTubeId(currentMediaSource) ? 'youtube' : 'direct');
                setupPlayer(currentMediaSource);
                document.getElementById('syncOverlay').classList.remove('hidden');
            }

            updateConnStatus("Connecting...", "connecting");
            peer = new Peer();

            peer.on('open', () => {
                hostConnection = peer.connect(targetRoomId, { reliable: true });

                hostConnection.on('open', () => {
                    updateConnStatus("Synced", "connected");
                    hostConnection.send({ type: 'REQUEST_SYNC' });
                });

                hostConnection.on('data', (data) => {
                    handleIncomingSignal(data, hostConnection);
                });

                hostConnection.on('close', () => {
                    alert("Room closed or Host disconnected.");
                    leaveRoom();
                });
            });

            peer.on('error', (err) => {
                console.warn("Peer error:", err);
                updateConnStatus("Offline", "disconnected");
            });
        }

        function handleIncomingSignal(data, senderConn) {
            if(data.type === 'ROOM_FULL') {
                alert("This room is already full (Maximum 6 persons).");
                leaveRoom();
                return;
            }

            if(data.type === 'CHAT_MSG') {
                appendChatMessage({ sender: data.sender, text: data.text, time: data.time, isMe: false });
                if(isHost) forwardToOtherGuests(data, senderConn);
                return;
            }

            if(data.type === 'REQUEST_SYNC' && isHost) {
                senderConn.send({
                    type: 'INIT_STATE',
                    mediaType: currentMediaType,
                    mediaSource: currentMediaSource,
                    time: getCurrentTime(),
                    isPlaying: isPlayerPlaying(),
                    speed: getCurrentSpeed()
                });
                return;
            }

            isInternalSync = true;

            if(data.type === 'INIT_STATE') {
                currentMediaType = data.mediaType;
                currentMediaSource = data.mediaSource;

                setupPlayer(data.mediaSource, () => {
                    seekToTime(data.time);
                    setPlaybackRate(data.speed || 1);
                    if(data.isPlaying) playVideo(); else pauseVideo();
                });
            } else if(data.type === 'PLAY') {
                seekToTime(data.time);
                playVideo();
                updatePlayPauseButton(true);
                if(isHost) forwardToOtherGuests(data, senderConn);
            } else if(data.type === 'PAUSE') {
                seekToTime(data.time);
                pauseVideo();
                updatePlayPauseButton(false);
                if(isHost) forwardToOtherGuests(data, senderConn);
            } else if(data.type === 'SEEK') {
                seekToTime(data.time);
                if(isHost) forwardToOtherGuests(data, senderConn);
            } else if(data.type === 'RATE') {
                setPlaybackRate(data.rate);
                if(isHost) forwardToOtherGuests(data, senderConn);
            }

            setTimeout(() => { isInternalSync = false; }, 600);
        }

        function forwardToOtherGuests(payload, originConn) {
            guestConnections.forEach(c => {
                if(c !== originConn && c.open) {
                    c.send(payload);
                }
            });
        }

        function broadcastToRoom(payload) {
            if(isInternalSync) return;
            if(isHost) {
                guestConnections.forEach(c => {
                    if(c.open) c.send(payload);
                });
            } else if(hostConnection && hostConnection.open) {
                hostConnection.send(payload);
            }
        }

        function setupPlayer(url, callback) {
            const ytId = getYouTubeId(url);
            const nativeVideo = document.getElementById('nativePlayer');
            const ytDiv = document.getElementById('ytPlayer');

            if(ytId) {
                currentMediaType = 'youtube';
                nativeVideo.classList.add('hidden');
                ytDiv.classList.remove('hidden');

                const attachYT = () => {
                    if(ytPlayer && ytPlayer.loadVideoById) {
                        ytPlayer.loadVideoById(ytId);
                        if(callback) callback();
                    } else {
                        ytPlayer = new YT.Player('ytPlayer', {
                            videoId: ytId,
                            playerVars: { 'autoplay': 0, 'controls': 1, 'playsinline': 1 },
                            events: {
                                'onReady': () => { if(callback) callback(); },
                                'onStateChange': onYouTubeStateChange
                            }
                        });
                    }
                };

                if(window.YT && window.YT.Player) attachYT();
                else {
                    const timer = setInterval(() => {
                        if(window.YT && window.YT.Player) {
                            clearInterval(timer);
                            attachYT();
                        }
                    }, 150);
                }
            } else {
                currentMediaType = 'direct';
                ytDiv.classList.add('hidden');
                nativeVideo.classList.remove('hidden');
                nativeVideo.src = url;

                nativeVideo.onplay = () => {
                    updatePlayPauseButton(true);
                    broadcastToRoom({ type: 'PLAY', time: nativeVideo.currentTime, sender: isHost ? 'Host' : 'Guest' });
                };
                nativeVideo.onpause = () => {
                    updatePlayPauseButton(false);
                    broadcastToRoom({ type: 'PAUSE', time: nativeVideo.currentTime, sender: isHost ? 'Host' : 'Guest' });
                };
                nativeVideo.onseeked = () => {
                    broadcastToRoom({ type: 'SEEK', time: nativeVideo.currentTime, sender: isHost ? 'Host' : 'Guest' });
                };
                nativeVideo.onratechange = () => {
                    broadcastToRoom({ type: 'RATE', rate: nativeVideo.playbackRate, sender: isHost ? 'Host' : 'Guest' });
                };

                if(callback) callback();
            }
        }

        function onYouTubeStateChange(e) {
            if(isInternalSync) return;
            const time = ytPlayer.getCurrentTime();
            if(e.data === YT.PlayerState.PLAYING) {
                updatePlayPauseButton(true);
                broadcastToRoom({ type: 'PLAY', time: time, sender: isHost ? 'Host' : 'Guest' });
            } else if(e.data === YT.PlayerState.PAUSED) {
                updatePlayPauseButton(false);
                broadcastToRoom({ type: 'PAUSE', time: time, sender: isHost ? 'Host' : 'Guest' });
            }
        }

        setInterval(() => {
            if(isInternalSync) return;
            const curTime = getCurrentTime();
            if(Math.abs(curTime - lastReportedTime) > 1.8 && isPlayerPlaying()) {
                broadcastToRoom({ type: 'SEEK', time: curTime, sender: isHost ? 'Host' : 'Guest' });
            }
            lastReportedTime = curTime;
        }, 500);

        function userTogglePlay() {
            const playing = isPlayerPlaying();
            const time = getCurrentTime();
            if(playing) {
                pauseVideo();
                broadcastToRoom({ type: 'PAUSE', time, sender: isHost ? 'Host' : 'Guest' });
            } else {
                playVideo();
                broadcastToRoom({ type: 'PLAY', time, sender: isHost ? 'Host' : 'Guest' });
            }
        }

        function userSeekDelta(delta) {
            const newTime = Math.max(0, getCurrentTime() + delta);
            seekToTime(newTime);
            broadcastToRoom({ type: 'SEEK', time: newTime, sender: isHost ? 'Host' : 'Guest' });
        }

        function userChangeSpeed(val) {
            const rate = parseFloat(val);
            setPlaybackRate(rate);
            broadcastToRoom({ type: 'RATE', rate, sender: isHost ? 'Host' : 'Guest' });
        }

        function updatePlayPauseButton(isPlaying) {
            const icon = document.getElementById('playIcon');
            const text = document.getElementById('playText');
            if(isPlaying) {
                icon.className = "fa-solid fa-pause";
                text.innerText = "Pause";
            } else {
                icon.className = "fa-solid fa-play";
                text.innerText = "Play";
            }
        }

        function playVideo() {
            try {
                if(currentMediaType === 'youtube' && ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
                else document.getElementById('nativePlayer').play();
                updatePlayPauseButton(true);
            } catch(e) {
                document.getElementById('syncOverlay').classList.remove('hidden');
            }
        }

        function pauseVideo() {
            if(currentMediaType === 'youtube' && ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
            else document.getElementById('nativePlayer').pause();
            updatePlayPauseButton(false);
        }

        function seekToTime(seconds) {
            if(currentMediaType === 'youtube' && ytPlayer && ytPlayer.seekTo) ytPlayer.seekTo(seconds, true);
            else document.getElementById('nativePlayer').currentTime = seconds;
            lastReportedTime = seconds;
        }

        function setPlaybackRate(rate) {
            document.getElementById('speedSelect').value = rate;
            if(currentMediaType === 'youtube' && ytPlayer && ytPlayer.setPlaybackRate) ytPlayer.setPlaybackRate(rate);
            else document.getElementById('nativePlayer').playbackRate = rate;
        }

        function getCurrentTime() {
            if(currentMediaType === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) return ytPlayer.getCurrentTime();
            return document.getElementById('nativePlayer').currentTime || 0;
        }

        function getCurrentSpeed() {
            return parseFloat(document.getElementById('speedSelect').value) || 1;
        }

        function isPlayerPlaying() {
            if(currentMediaType === 'youtube' && ytPlayer && ytPlayer.getPlayerState) {
                return ytPlayer.getPlayerState() === YT.PlayerState.PLAYING;
            }
            const nat = document.getElementById('nativePlayer');
            return !!(nat.currentTime > 0 && !nat.paused && !nat.ended && nat.readyState > 2);
        }

        function unlockPlayback() {
            document.getElementById('syncOverlay').classList.add('hidden');
            playVideo();
            if(hostConnection && hostConnection.open) {
                hostConnection.send({ type: 'REQUEST_SYNC' });
            }
        }

        // Live Chat
        function handleSendChat(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const senderRole = isHost ? 'Host' : 'Guest';
            appendChatMessage({ sender: senderRole, text, time: timeStr, isMe: true });

            broadcastToRoom({ type: 'CHAT_MSG', sender: senderRole, text, time: timeStr });
            input.value = '';
        }

        function appendChatMessage(data) {
            const container = document.getElementById('chatMessages');
            const row = document.createElement('div');
            row.className = data.isMe ? 'flex flex-col items-end' : 'flex flex-col items-start';

            const bubble = document.createElement('div');
            bubble.className = data.isMe
                ? 'bg-rose-600 text-white rounded-2xl rounded-tr-none px-3.5 py-2 text-xs max-w-[85%] break-words shadow-md'
                : 'bg-slate-800 text-slate-100 border border-slate-700 rounded-2xl rounded-tl-none px-3.5 py-2 text-xs max-w-[85%] break-words shadow-md';
            bubble.innerText = data.text;

            const meta = document.createElement('div');
            meta.className = 'text-[9px] text-slate-500 mt-1 px-1';
            meta.innerText = `${data.sender} • ${data.time}`;

            row.appendChild(bubble);
            row.appendChild(meta);
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function broadcastSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = "text-center text-[10px] text-slate-400 font-semibold my-1";
            msg.innerText = `⚡ ${text}`;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        function showTheaterScreen(isHostRole) {
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('theaterScreen').classList.remove('hidden');
            document.getElementById('roomMemberBadge').classList.remove('hidden');

            const badge = document.getElementById('roleBadge');
            badge.innerText = isHostRole ? "Host" : "Guest";
            badge.className = isHostRole 
                ? "text-xs font-bold px-2.5 py-1 rounded-md bg-rose-500/20 text-rose-400 border border-rose-500/30"
                : "text-xs font-bold px-2.5 py-1 rounded-md bg-blue-500/20 text-blue-400 border border-blue-500/30";
        }

        function updateMemberBadge(count) {
            document.getElementById('memberCountText').innerText = `👥 ${count}/6 in Room`;
        }

        function copyFullLink() {
            if(currentRoomId && currentMediaSource) {
                const url = `${window.location.protocol}//${window.location.host}${window.location.pathname}?room=${currentRoomId}&v=${encodeURIComponent(currentMediaSource)}&type=${currentMediaType}`;
                navigator.clipboard.writeText(url).then(() => {
                    alert("Room link copied! Share with up to 5 friends.");
                });
            }
        }

        function leaveRoom() {
            if(confirm("Do you want to exit the room?")) {
                window.location.href = window.location.pathname;
            }
        }

        // Auto join directly on link open
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const rKey = params.get('room');
            const vUrl = params.get('v');
            const vType = params.get('type');

            if(rKey) {
                joinRoomDirectly(rKey, vUrl, vType);
            }
        });
    </script>
</body>
</html>
